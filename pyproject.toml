[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurotek-edge-detection"
version = "0.1.0"
description = "Sobel edge detection for Aurotek Router camera images."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.24",
    "lap>=0.5.12",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "ultralytics>=8.3"
]

[project.scripts]
aurotek-sobel-edge = "sobel_edge_main:main"
sobel-fine-tune = "sobel_fine_tune_gui:main"
sobel-yolo-realtime = "realtime_predict_ui:main"

[tool.setuptools]
py-modules = [
    "app_paths",
    "app_preferences",
    "command_line_interface",
    "edge_view",
    "file_io",
    "image_file_discovery",
    "recipe_store",
    "realtime_app",
    "realtime_config",
    "realtime_overlay",
    "realtime_predict_ui",
    "realtime_predictor",
    "realtime_product_info",
    "sobel_edge_main",
    "sobel_edge_output",
    "sobel_edge_detection",
    "sobel_fine_tune_gui",
    "yolo_training",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
